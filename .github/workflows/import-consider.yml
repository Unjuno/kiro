name: Import and verify Consider the Consequences
on:
  push:
    branches: [port/consider-offline]
    paths:
      - scripts/import_consider.py
      - .github/workflows/import-consider.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kiro-consider-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Capture every original scene and validate graph
        run: python3 scripts/import_consider.py --fetch
      - name: Commit verified source snapshot and graph to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stories/consider-the-consequences reports/consider-validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: archive and validate complete Consider the Consequences graph'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Report validation
        if: always()
        run: |
          if [ -f reports/consider-validation.json ]; then
            cat reports/consider-validation.json
            printf '\n### Story validation\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat reports/consider-validation.json >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
